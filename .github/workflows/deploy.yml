name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 공개 대상만 추려서 올린다.
      # tools/(로컬 관리자), docs/(설계 문서), data/backups/ 는 배포에서 제외.
      - name: Collect public files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r data _site/
          rm -rf _site/data/backups
          test -f _site/data/content.json

      # 배포마다 자산 URL에 커밋 해시를 붙여 브라우저가 옛 파일을 재사용하지 못하게 한다.
      # (data/content.json 은 app.js 가 no-cache 로 받아온다)
      - name: Cache-bust assets
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s|assets/style\.css|assets/style.css?v=$V|; s|assets/app\.js|assets/app.js?v=$V|" _site/index.html
          grep -o 'assets/[a-z.]*?v=[a-f0-9]*' _site/index.html
          echo "--- 배포 대상 ---"
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
